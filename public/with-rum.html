      firebase.initializeApp(firebaseConfig);

      firebase
        .firestore()
        .collection("documents")
        .doc("my_document")
        .onSnapshot(
          (doc) => {
            document.getElementById("out").textContent = JSON.stringify(
              doc.data(),
              null,
              2

            document.getElementById("out").textContent =
